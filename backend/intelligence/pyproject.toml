[project]
name = "paraxis-intelligence"
version = "0.1.0"
description = "Paraxis AI Intelligence & Agent Platform (FastAPI + LangGraph)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.30",
    "pgvector>=0.3.2",
    "asyncpg>=0.29.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
